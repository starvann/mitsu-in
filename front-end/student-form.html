<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>MITSU.IN – Form Pendaftaran Siswa</title>
    <link rel="stylesheet" href="assets/css/style.css" />

    <style>
      /* Styling tambahan khusus dynamic group */
      .repeat-group {
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-bottom: 16px;
        background: #fafafa;
      }

      .remove-btn {
        background: #c62828;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        margin-top: 6px;
        cursor: pointer;
        font-size: 13px;
      }

      .btn-add {
        margin-top: 12px;
      }
    </style>
  </head>

  <body class="screen-auth">
    <main class="auth-page">
      <h1 class="title-jp">こんにちは!</h1>
      <p class="subtitle">
        Siap memulai perjalanan kariermu? Yuk, gabung bareng kami!
      </p>

      <form id="studentForm" class="card auth-card">
        <!-- ======================== -->
        <!--        DATA PRIBADI      -->
        <!-- ======================== -->

        <h2 class="section-title">Data Pribadi</h2>

        <label
          >Kode Referral
          <input type="text" name="referralCode" placeholder="Opsional" />
        </label>

        <label
          >Nama
          <input type="text" name="fullName" required />
        </label>

        <label
          >Foto Profil
          <input type="file" id="photoInput" accept="image/*" />
        </label>

        <!-- Preview kecil biar siswa lihat fotonya -->
        <img
          id="photoPreview"
          src="assets/img/avatar-default.png"
          alt="Preview Foto"
          style="
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 8px;
          "
        />

        <label
          >No. Handphone
          <input type="text" name="phone" required />
        </label>

        <label
          >Jenis Kelamin
          <select name="gender" required>
            <option value="">Pilih</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </label>

        <label
          >Usia
          <input type="number" name="age" min="15" required />
        </label>

        <label
          >Tinggi Badan (cm)
          <input type="number" name="height" required />
        </label>

        <div class="section-divider"></div>

        <!-- ================================ -->
        <!--    KONDISI & LATAR BELAKANG     -->
        <!-- ================================ -->

        <h2 class="section-title">Kondisi & Latar Belakang</h2>

        <label
          >Berat Badan (kg)
          <input type="number" name="weight" required />
        </label>

        <label
          >Status Perkawinan
          <input type="text" name="maritalStatus" />
        </label>

        <label
          >Golongan Darah
          <input type="text" name="bloodType" />
        </label>

        <label
          >Agama
          <input type="text" name="religion" />
        </label>

        <label
          >Pernah ke Jepang?
          <select name="everInJapan">
            <option value="">Pilih</option>
            <option value="0">Belum pernah</option>
            <option value="1">Sudah pernah</option>
          </select>
        </label>

        <label
          >Pernah punya paspor?
          <select name="hasPassport">
            <option value="">Pilih</option>
            <option value="0">Belum</option>
            <option value="1">Sudah</option>
          </select>
        </label>

        <label
          >Tangan Ahli
          <select name="dominantHand">
            <option value="">Pilih</option>
            <option value="KANAN">Kanan</option>
            <option value="KIRI">Kiri</option>
            <option value="DUA">Keduanya</option>
          </select>
        </label>

        <div class="section-divider"></div>

        <!-- ================================ -->
        <!--      ALAMAT & PENDIDIKAN         -->
        <!-- ================================ -->

        <h2 class="section-title">Alamat & Pendidikan</h2>

        <label
          >Alamat Rumah
          <textarea name="address" rows="3"></textarea>
        </label>

        <!-- PENDIDIKAN TERAKHIR (Dynamic Group) -->
        <div class="subsection">
          <div class="subsection-title">Pendidikan Terakhir</div>

          <div id="edu-wrapper">
            <div class="repeat-group edu-group">
              <label
                >Tahun Lulus
                <input type="number" name="eduYear[]" />
              </label>

              <label
                >Nama Sekolah
                <input type="text" name="eduSchool[]" />
              </label>

              <label
                >Jurusan
                <input type="text" name="eduMajor[]" />
              </label>

              <button type="button" class="remove-btn">Hapus</button>
            </div>
          </div>

          <button
            type="button"
            id="add-edu"
            class="btn-primary btn-small btn-add"
          >
            Tambah Informasi +
          </button>
        </div>

        <!-- PENGALAMAN (Dynamic Group) -->
        <div class="subsection">
          <div class="subsection-title">Pengalaman</div>

          <div id="exp-wrapper">
            <div class="repeat-group exp-group">
              <label
                >Pengalaman Kerja / Magang
                <input type="text" name="experience[]" />
              </label>

              <button type="button" class="remove-btn">Hapus</button>
            </div>
          </div>

          <button
            type="button"
            id="add-exp"
            class="btn-primary btn-small btn-add"
          >
            Tambah Informasi +
          </button>
        </div>

        <div class="section-divider"></div>

        <!-- ================================ -->
        <!--            KELUARGA              -->
        <!-- ================================ -->

        <h2 class="section-title">Keluarga & Tujuan</h2>

        <div class="subsection">
          <div class="subsection-title">Susunan Keluarga (utama)</div>

          <div id="family-wrapper">
            <div class="repeat-group family-group">
              <label
                >Hubungan
                <input
                  type="text"
                  name="familyRelation[]"
                  placeholder="Ayah / Ibu / Wali"
                />
              </label>

              <label
                >Nama
                <input type="text" name="familyName[]" />
              </label>

              <label
                >Usia
                <input type="number" name="familyAge[]" />
              </label>

              <label
                >Pekerjaan
                <input type="text" name="familyJob[]" />
              </label>

              <label
                >Gaji (perkiraan per bulan)
                <input type="number" name="familyIncome[]" />
              </label>

              <button type="button" class="remove-btn">Hapus</button>
            </div>
          </div>

          <button
            type="button"
            id="add-family"
            class="btn-primary btn-small btn-add"
          >
            Tambah Informasi +
          </button>
        </div>

        <label
          >Tujuan ke Jepang
          <input type="text" name="goalJapan" />
        </label>

        <div class="section-divider"></div>

        <!-- ================================ -->
        <!--        FORM BAGIAN BAWAH         -->
        <!-- ================================ -->

        <h2 class="section-title">Rencana & Sertifikat</h2>

        <label
          >Setelah pulang dari Jepang, rencana apa?
          <input type="text" name="afterJapanPlan" />
        </label>

        <label
          >Kelebihan
          <input type="text" name="strength" />
        </label>

        <label
          >Kekurangan
          <input type="text" name="weakness" />
        </label>

        <label
          >Hobi
          <input type="text" name="hobby" />
        </label>

        <div class="subsection">
          <div class="subsection-title">Sertifikat yang Dimiliki</div>

          <label
            >JLPT / Setara
            <input type="text" name="certificateJlpt" />
          </label>

          <label
            >Surat Izin Mengemudi (SIM A)
            <input type="text" name="certificateSim" />
          </label>

          <label
            >Lain-lain
            <input type="text" name="certificateOther" />
          </label>
        </div>

        <div class="section-divider"></div>

        <h2 class="section-title">Kerabat / Kenalan di Jepang</h2>

        <label
          >Nama
          <input type="text" name="jpContactName" />
        </label>

        <label
          >Hubungan
          <input type="text" name="jpContactRelation" />
        </label>

        <label
          >Pekerjaan
          <input type="text" name="jpContactJob" />
        </label>

        <label
          >Usia
          <input type="number" name="jpContactAge" />
        </label>

        <label
          >Alamat di Jepang
          <textarea name="jpContactAddress" rows="3"></textarea>
        </label>

        <label
          >Catatan Tambahan
          <textarea name="notes" rows="3"></textarea>
        </label>

        <button type="submit" class="btn-primary" style="margin-top: 16px">
          Submit
        </button>
      </form>
    </main>

    <!-- ======================== -->
    <!--     DYNAMIC JS GROUP     -->
    <!-- ======================== -->

    <script>
      function cloneGroup(selector, wrapperId) {
        const original = document.querySelector(selector);
        const clone = original.cloneNode(true);

        clone
          .querySelectorAll("input, textarea")
          .forEach((i) => (i.value = ""));

        document.getElementById(wrapperId).appendChild(clone);
      }

      document.getElementById("add-edu").onclick = () =>
        cloneGroup(".edu-group", "edu-wrapper");
      document.getElementById("add-exp").onclick = () =>
        cloneGroup(".exp-group", "exp-wrapper");
      document.getElementById("add-family").onclick = () =>
        cloneGroup(".family-group", "family-wrapper");

      document.addEventListener("click", function (e) {
        if (e.target.classList.contains("remove-btn")) {
          e.target.closest(".repeat-group").remove();
        }
      });

      const photoInput = document.getElementById("photoInput");
      const photoPreview = document.getElementById("photoPreview");
      const form = document.getElementById("studentForm"); // sesuaikan id form kamu

      // saat user pilih foto → langsung preview
      photoInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          photoPreview.src = e.target.result;

          // simpan ke localStorage sebagai base64
          localStorage.setItem("studentPhoto", e.target.result);
        };
        reader.readAsDataURL(file);
      });

      // saat form disubmit → kita bisa sekalian simpan nama juga buat dipakai di dashboard
      form.addEventListener("submit", function (e) {
        // e.preventDefault(); // ini dihapus kalau backend temenmu sudah siap

        const nameInput = form.querySelector('input[name="fullName"]');
        if (nameInput) {
          localStorage.setItem("studentName", nameInput.value);
        }

        // backend urus submit asli
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const siswa = {
          nama: form.fullName.value,
          phone: form.phone.value,
          gender: form.gender.value,
          foto:
            localStorage.getItem("studentPhoto") ||
            "assets/img/avatar-default.png",
        };

        // Ambil data lama
        const dataLama = JSON.parse(localStorage.getItem("dataSiswa")) || [];

        // Masukkan data baru
        dataLama.push(siswa);

        // Simpan lagi
        localStorage.setItem("dataSiswa", JSON.stringify(dataLama));

        alert("Pendaftaran berhasil!");
        form.reset();
        photoPreview.src = "assets/img/avatar-default.png";
      });
    </script>
  </body>
</html>
