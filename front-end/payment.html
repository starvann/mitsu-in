<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pembayaran – MITSU.IN</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .payment-card {
      padding: 20px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    .price {
      font-size: 22px;
      font-weight: 700;
      color: #8B0000;
      margin-bottom: 10px;
      margin-top: 5px;
    }

    .upload-box {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-top: 12px;
      margin-bottom: 16px;
      background: #fafafa;
    }

    .status-info {
      margin-top: 10px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body class="screen-auth">
  <main class="auth-page">

    <h1 class="title-jp">お支払い</h1>
    <p class="subtitle">Silakan selesaikan pembayaran untuk melanjutkan proses pendaftaran.</p>

    <div class="payment-card">

      <h2 class="section-title">Detail Pembayaran</h2>

      <div class="price">Rp 250.000</div>

      <p><strong>Transfer ke rekening berikut:</strong></p>
<p>    <strong>BCA:</strong> 123456789 – a/n PT MITSU INDOJAYA</p>
<p>    <strong>QRIS:</strong> LPK MITS GAKUEN</p>

      <img src="assets/img/qris.jpeg" alt="QRIS" style="width:50%; border-radius:10px; margin-top:10px;">

      <div class="upload-box">
        <label>
          Upload Bukti Pembayaran<br>
          <input type="file" id="paymentProof" name="paymentProof" accept="image/*" required>
        </label>
      </div>

      <button class="btn-primary" id="submitPayment">Kirim Bukti Pembayaran</button>

      <p class="status-info">
        Setelah mengirim bukti pembayaran, statusmu akan otomatis menjadi:  
        <strong>Menunggu konfirmasi admin</strong>.
      </p>

    </div>

  </main>

  <script>
    document.getElementById("submitPayment").addEventListener("click", function () {
      const file = document.getElementById("paymentProof").files[0];

      if (!file) {
        alert("Harap upload bukti pembayaran lebih dulu.");
        return;
      }

      // simulasikan redirect ke halaman waiting
      window.location.href = "payment-waiting.html";
    });
  </script>
</body>
</html>
