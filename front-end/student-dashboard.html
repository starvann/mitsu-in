<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Siswa – MITSU.IN</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div class="page">
      <div class="top-section">
        <div
          class="cover"
          style="background-image: url('assets/img/cover-japan.jpg')"
        >
          <div class="avatar-wrapper">
            <img id="studentAvatar" src="assets/img/avatar-default.png" />
          </div>
        </div>

        <div class="header-block">
          <div id="studentName" class="student-name">Nama Siswa</div>
        </div>

        <div class="status-row">
          <div class="qr-box">
            <img src="assets/img/qr-sample.png" />
          </div>

          <div class="progress-box">
            <svg>
              <circle
                cx="45"
                cy="45"
                r="38"
                stroke="#e0d8c7"
                stroke-width="8"
                fill="none"
              />
              <circle
                id="progressCircle"
                cx="45"
                cy="45"
                r="38"
                stroke="#c00000"
                stroke-width="8"
                fill="none"
                stroke-linecap="round"
              />
            </svg>
            <div id="progressValue" class="progress-text">0%</div>
          </div>
        </div>
      </div>

      <section class="card" style="margin-top: 16px">
        <h2 class="section-title">Status Pembayaran</h2>

        <div id="paymentStatusBox" class="payment-status pending">
          <span id="paymentStatusText">Menunggu konfirmasi</span>
        </div>
      </section>

      <!-- IZIN -->
      <section class="card">
        <h2 class="section-title">Izin</h2>
        <p class="subtitle">Sertakan dokumen yang mendukung.</p>

        <label
          >Alasan
          <select name="reason">
            <option value="">Pilih alasan</option>
            <option value="sakit">Sakit</option>
            <option value="izin">Izin</option>
            <option value="darurat">Darurat</option>
          </select>
        </label>

        <label
          >Alasan Mendukung
          <input type="text" name="reason_detail" />
        </label>

        <div class="file-label">
          <span>📎 Upload Dokumen</span>
          <input type="file" name="proof" accept="image/*" />
        </div>

        <button class="btn-primary" style="margin-top: 14px">Submit</button>
      </section>

      <div class="izin-footer">
        <span>Lorem ipsum</span>
        <button id="btnKerjakan" class="btn-secondary">Kerjakan</button>
      </div>
    </div>

    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
