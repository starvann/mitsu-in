<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Referraler – MITSU.IN</title>
    <style>
      body {
        margin: 0;
        background: #f3ecd2;
        font-family: Arial;
        text-align: center;
      }
      .cover-ref {
        width: 100%;
        height: 160px;
        background-image: url("assets/img/cover-japan.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border-bottom-left-radius: 14px;
        border-bottom-right-radius: 14px;
        position: relative;
      }
      .avatar-wrapper-ref {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        overflow: hidden;
        border: 5px solid white;
        position: absolute;
        bottom: -55px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
      }
      .avatar-wrapper-ref img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .name {
        font-size: 22px;
        font-weight: bold;
        margin-top: 70px;
        margin-bottom: 18px;
        color: #333;
      }
      .card {
        width: 90%;
        max-width: 420px;
        background: white;
        margin: 0 auto 25px;
        padding: 18px 20px;
        border-radius: 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        text-align: left;
      }
      .item {
        padding: 12px 0;
        border-bottom: 1px solid #eee;
      }
      .item:last-child {
        border-bottom: none;
      }
      .student-name {
        font-size: 15px;
        font-weight: bold;
      }
      .student-status {
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="cover-ref">
      <div class="avatar-wrapper-ref">
        <img id="refAvatar" src="assets/img/avatar-default.png" />
      </div>
    </div>
    <div id="refName" class="name"></div>
    <div class="card">
      <div class="item">
        <div class="student-name">
          Kode Referral: <span id="refCode"></span>
        </div>
      </div>
    </div>
    <div class="card" id="studentList"></div>
    <script>
      const data = JSON.parse(localStorage.getItem("referraler"));
      if (!data) {
        location.href = "referraler-register.html";
      }
      document.getElementById("refAvatar").src = data.foto;
      document.getElementById("refName").innerText = data.nama;
      document.getElementById("refCode").innerText = data.referralCode;
      const listBox = document.getElementById("studentList");
      if (!data.students || data.students.length === 0) {
        listBox.innerHTML =
          "<div style='text-align:center; color:#666; padding:15px 0;'>Belum ada siswa menggunakan kode ini</div>";
      } else {
        data.students.forEach((s) => {
          const row = document.createElement("div");
          row.className = "item";
          row.innerHTML =
            "<div class='student-name'>" +
            s.name +
            "</div>" +
            "<div class='student-status'>" +
            s.status +
            "</div>";
          listBox.appendChild(row);
        });
      }
    </script>
  </body>
</html>
