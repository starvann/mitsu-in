<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Exam Builder – Admin</title>

    <style>
      body {
        margin: 0;
        background: #f3ecd2;
        font-family: Arial;
      }

      .container {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin: 0 0 5px 0;
        font-size: 26px;
        color: #700000;
      }

      .subtitle {
        color: #777;
        font-size: 14px;
        margin-bottom: 25px;
      }

      .question-box {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
      }

      .question-title {
        font-weight: bold;
        margin-bottom: 10px;
      }

      .option-group {
        margin-bottom: 10px;
        display: flex;
        gap: 10px;
      }

      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }

      .btn-add {
        background: #700000;
        color: white;
        margin-top: 10px;
      }

      .btn-save {
        background: #700000;
        color: white;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Buat Ujian</h2>
      <div class="subtitle">Masukkan pertanyaan dan kunci jawaban</div>

      <div id="question-area"></div>

      <button class="btn-add" onclick="addQuestion()">Tambah Pertanyaan</button>
      <button class="btn-save" onclick="saveExam()">Simpan Ujian</button>
    </div>

    <script>
      let questionCount = 0;

      function addQuestion() {
        questionCount++;

        const box = document.createElement("div");
        box.className = "question-box";
        box.innerHTML = `
    <div class="question-title">Pertanyaan ${questionCount}</div>
    <input type="text" class="q-text" placeholder="Tulis pertanyaan..." style="width:100%; padding:8px; margin-bottom:10px; border-radius:6px; border:1px solid #ccc">

    <div class="option-list"></div>
    <button class="btn-add" onclick="addOption(this)">Tambah Jawaban</button>
  `;
        document.getElementById("question-area").appendChild(box);
      }

      function addOption(button) {
        const list = button.parentElement.querySelector(".option-list");

        const wrapper = document.createElement("div");
        wrapper.className = "option-group";

        wrapper.innerHTML = `
    <input type="radio" name="correct-${questionCount}">
    <input type="text" class="opt-text" placeholder="Option..." style="flex:1; padding:6px; border-radius:6px; border:1px solid #ccc">
  `;

        list.appendChild(wrapper);
      }

      function saveExam() {
        const questions = [];
        const boxes = document.querySelectorAll(".question-box");

        boxes.forEach((box, i) => {
          const qText = box.querySelector(".q-text").value;
          const options = [];
          const optionNodes = box.querySelectorAll(".option-group");
          let correctIndex = -1;

          optionNodes.forEach((opt, j) => {
            const text = opt.querySelector(".opt-text").value;
            const isCorrect = opt.querySelector("input[type=radio]").checked;
            options.push(text);
            if (isCorrect) correctIndex = j;
          });

          questions.push({
            question: qText,
            options: options,
            correct: correctIndex,
          });
        });

        localStorage.setItem("exam_data", JSON.stringify(questions));
        alert("Ujian berhasil disimpan.");
      }
    </script>
  </body>
</html>
