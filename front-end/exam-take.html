<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kerjakan Ujian</title>

    <style>
      body {
        margin: 0;
        background: #f3ecd2;
        font-family: Arial;
      }

      .container {
        max-width: 700px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin: 0 0 15px 0;
        font-size: 26px;
        color: #700000;
      }

      .q-box {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
      }

      .btn-submit {
        background: #700000;
        color: white;
        padding: 12px;
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
      }

      .result-card {
        margin-top: 25px;
        background: white;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        font-size: 18px;
        color: #700000;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Ujian</h2>
      <div id="exam"></div>
      <button class="btn-submit" onclick="checkScore()">Submit</button>
      <div id="result"></div>
    </div>
    <div id="result"></div>

    <script>
      const examData = JSON.parse(localStorage.getItem("exam_data"));
      const examArea = document.getElementById("exam");

      examData.forEach((q, i) => {
        const box = document.createElement("div");
        box.className = "q-box";

        let opts = "";
        q.options.forEach((opt, j) => {
          opts += `
      <label style="display:block; margin-bottom:5px">
        <input type="radio" name="q${i}" value="${j}"> ${opt}
      </label>
    `;
        });

        box.innerHTML = `
    <div><strong>${q.question}</strong></div>
    ${opts}
  `;

        examArea.appendChild(box);
      });

      function checkScore() {
        let score = 0;

        examData.forEach((q, i) => {
          const selected = document.querySelector(
            `input[name="q${i}"]:checked`
          );
          if (!selected) return;
          if (parseInt(selected.value) === q.correct) score++;
        });

        const resultBox = document.getElementById("result");
        resultBox.innerHTML = `
  <div class="result-card">
    Skor Kamu: <strong>${score}</strong> dari ${examData.length}
  </div>
`;
      }
    </script>
  </body>
</html>
