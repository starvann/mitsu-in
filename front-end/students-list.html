<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Data Siswa</title>

    <style>
      body {
        margin: 0;
        background: #f3ecd2;
        font-family: Arial;
      }

      .card {
        width: 90%;
        max-width: 450px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      }

      h2 {
        text-align: center;
        margin: 0 0 20px 0;
        color: #700000;
        font-size: 20px;
      }

      .search-box {
        margin-bottom: 18px;
      }

      .search-box input {
        width: 95%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 14px;
      }

      .student {
        display: flex;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        cursor: pointer;
      }

      .student:last-child {
        border-bottom: none;
      }

      .student img {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
      }

      .student-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .student-info .name {
        font-size: 15px;
        font-weight: bold;
      }

      .student-info .desc {
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h2>Data Siswa</h2>

      <div class="search-box">
        <input type="text" id="search" placeholder="Cari nama siswa..." />
      </div>

      <div id="list"></div>
    </div>

    <script>
      let dataSiswa = JSON.parse(localStorage.getItem("dataSiswa")) || [];

      function renderList(filterText = "") {
        const list = document.getElementById("list");
        list.innerHTML = "";

        const filtered = dataSiswa.filter((s) =>
          s.nama.toLowerCase().includes(filterText.toLowerCase())
        );

        filtered.forEach((s) => {
          const el = document.createElement("div");
          el.className = "student";

          // ketika diklik menuju halaman detail
          el.onclick = () => {
            localStorage.setItem("selectedStudent", JSON.stringify(s));
            window.location.href = "detail-siswa.html";
          };

          el.innerHTML = `
        <img src="${s.foto}">
        <div class="student-info">
          <div class="name">${s.nama}</div>
          <div class="desc">${s.phone} • ${s.gender}</div>
        </div>
      `;

          list.appendChild(el);
        });
      }

      // event pencarian
      document.getElementById("search").addEventListener("input", function () {
        renderList(this.value);
      });

      renderList();
    </script>
  </body>
</html>
