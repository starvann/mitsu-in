<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Status Pembayaran – MITSU.IN</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .waiting-card {
      padding: 22px;
      background: #fff;
      border-radius: 14px;
      margin-top: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .status-badge {
      padding: 12px 18px;
      border-radius: 12px;
      display: inline-block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 15px;
    }

    .waiting {
      background: #fff4d0;
      color: #9a6a00;
    }
  </style>
</head>

<body class="screen-auth">
  <main class="auth-page">

    <h1 class="title-jp">支払い確認</h1>

    <div class="waiting-card">
      <h2 class="section-title">Menunggu Konfirmasi</h2>

      <p class="subtitle">
        Terima kasih! Bukti pembayaranmu sudah kami terima.<br>
        Admin sedang memeriksa pembayaranmu secara manual.
      </p>

      <div class="status-badge waiting">
        Status: Menunggu Konfirmasi
      </div>

      <p style="margin-top:16px;">
        Kamu dapat kembali ke dashboard untuk melihat update status.
      </p>

      <button onclick="window.location.href='dashboard.html'" class="btn-primary" style="margin-top:18px;">
        Kembali ke Dashboard
      </button>
    </div>

  </main>
</body>
</html>
